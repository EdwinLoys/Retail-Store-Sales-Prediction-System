[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-sales-prediction"
version = "0.1.0"
description = "Retail store sales forecasting using scikit‑learn"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "joblib",
]

[project.scripts]
app = "app:main"
